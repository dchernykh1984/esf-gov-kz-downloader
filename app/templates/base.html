<html>
<head>
<meta charset="utf-8"/>
<style>
    @font-face { font-family: DejaVu; src: url(fonts/DejaVuSans.ttf) }
    @font-face { font-family: DejaVu; src: url(fonts/DejaVuSans-Bold.ttf); font-weight: bold }

    @page { size: a4 landscape; margin: 1cm 1cm 1.4cm 1cm;
            @frame footer { -pdf-frame-content: footer; bottom: 0.6cm; height: 0.8cm;
                            left: 1cm; right: 1cm } }

    body { font-family: DejaVu; font-size: 7pt; color: #000 }
    h1 { font-size: 11pt; margin: 0 0 2mm 0; text-align: center }
    .subtitle { text-align: center; font-size: 8pt; margin-bottom: 3mm }
    .status { font-size: 9pt; font-weight: bold; text-align: center;
              border: 1pt solid #000; padding: 1mm; margin-bottom: 3mm }
    .section { font-size: 8pt; font-weight: bold; background-color: #e8e8e8;
               border: 0.5pt solid #000; padding: 1mm; margin-top: 2mm }
    table { border-collapse: collapse; width: 100%; margin: 0 }
    td, th { border: 0.5pt solid #000; padding: 0.6mm; vertical-align: top }
    /* Font size only, set on the table so it is inherited. Overriding cell
       padding through a `table.items td` selector makes the column solver
       disagree with itself once a colspan is involved, and it fails outright. */
    table.items { font-size: 6pt }
    th { background-color: #f2f2f2; font-weight: bold; text-align: center }
    td.caption { background-color: #fafafa; width: 22%; font-size: 6.5pt }
    td.num { text-align: right }
    td.centre { text-align: center }
    tr.totals td { font-weight: bold; background-color: #f2f2f2 }
    #footer { font-size: 5.5pt; color: #444; text-align: center }
</style>
</head>
<body>
{% block content %}{% endblock %}
<div id="footer">{{ L('generated_note') }}</div>
</body>
</html>
